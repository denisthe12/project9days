<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Фирменная палитра — Mangystau Hub</title>
  <style>
    *{box-sizing:border-box}html{font-family:Inter,system-ui,sans-serif}body{margin:0;background:#090909;color:#f5f5f4}.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:16px max(20px,calc((100% - 1120px)/2));background:rgba(9,9,9,.88);backdrop-filter:blur(16px);border-bottom:1px solid #292524}.top strong{font-size:14px}.top span{display:block;margin-top:3px;color:#a8a29e;font-size:12px}.toggle,.btn{min-height:42px;border-radius:999px;border:1px solid var(--border);padding:0 16px;font:600 13px inherit;cursor:pointer}.toggle{color:inherit;background:transparent;border-color:#44403c}.toggle:focus-visible,.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}.wrap{width:min(1120px,calc(100% - 32px));margin:0 auto;padding:40px 0 72px}.intro{max-width:680px;margin-bottom:28px}.intro h1{font-size:clamp(32px,6vw,60px);letter-spacing:-.05em;line-height:1;margin:0 0 14px}.intro p{color:#a8a29e;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.palette{background:var(--bg);color:var(--fg);border:1px solid var(--border);border-radius:22px;overflow:hidden}.head{padding:22px;display:flex;gap:14px;align-items:center}.number{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--primary);color:var(--primary-fg);font-weight:800}.head h2{font-size:19px;margin:0}.head p{font-size:12px;margin:4px 0 0;color:var(--muted-fg);text-transform:uppercase;letter-spacing:.08em}.swatches{display:grid;grid-template-columns:repeat(5,1fr);height:66px}.swatches i{display:flex;align-items:flex-end;padding:6px;font:9px ui-monospace;color:white;text-shadow:0 1px 4px #000}.ui{padding:22px;display:grid;grid-template-columns:1.25fr .75fr;gap:12px}.ui h3{font-size:25px;line-height:1.05;letter-spacing:-.035em;margin:0 0 9px}.ui p{font-size:13px;line-height:1.5;color:var(--muted-fg);margin:0 0 16px}.buttons{display:flex;gap:8px}.primary{background:var(--primary);color:var(--primary-fg);border-color:transparent}.secondary{background:transparent;color:var(--fg)}.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px}.card small{color:var(--muted-fg)}.card strong{display:block;font-size:24px;margin:8px 0}.check{padding:12px 22px;border-top:1px solid var(--border);font-size:11px;color:var(--muted-fg)}.check b{color:#22c55e}.pick{text-align:center;color:#a8a29e;margin:30px 0 0}.pick code{color:#fff;background:#292524;padding:3px 7px;border-radius:5px}@media(max-width:760px){.grid{grid-template-columns:1fr}.ui{grid-template-columns:1fr}.top span{display:none}}@media(prefers-reduced-motion:no-preference){.btn{transition:transform .1s ease-out}.btn:active{transform:scale(.97)}}
  </style>
</head>
<body>
  <header class="top"><div><strong>Mangystau Hub · выбор палитры</strong><span>Образовательная платформа для обучения в Мангистау</span></div><button class="toggle" id="theme">Светлая тема</button></header>
  <main class="wrap"><section class="intro"><h1>Шесть направлений бренда</h1><p>Все варианты премиальные, но с разным характером: от спокойной эстетики Каспия до тёплых оттенков плато Устюрт.</p></section><section class="grid" id="palettes"></section><p class="pick">Выберите <code>1–6</code> или попросите «ещё варианты как №…»</p></main>
  <script>
    const palettes=[
      {name:'Каспийский индиго',vibe:'премиальный · уверенный · современный',light:['#F6F7FB','#FFFFFF','#4338A8','#9B91E8','#17152B'],dark:['#0E0D1B','#17152B','#9B91E8','#4338A8','#F5F3FF']},
      {name:'Золото степи',vibe:'тёплый · статусный · локальный',light:['#F8F5ED','#FFFFFF','#73591D','#C8A95A','#211B10'],dark:['#151209','#211B10','#D8BB69','#73591D','#FCF7E9']},
      {name:'Каспийский нефрит',vibe:'спокойный · интеллектуальный · свежий',light:['#F1F7F5','#FFFFFF','#176B5A','#77BCAE','#10231F'],dark:['#091713','#10231F','#72C8B5','#176B5A','#ECFAF6']},
      {name:'Песчаный клуб',vibe:'тихий люкс · гуманистичный · мягкий',light:['#F6F2EA','#FFFFFF','#6B5A47','#B8A188','#1F1B14'],dark:['#15120E','#211C16','#C8B195','#6B5A47','#F7F2E9']},
      {name:'Северный сланец',vibe:'строгий · академичный · технологичный',light:['#F3F5F8','#FFFFFF','#394E76','#91A4C8','#151B28'],dark:['#0D1017','#161B25','#91A4C8','#394E76','#EFF1F5']},
      {name:'Аметист Устюрта',vibe:'креативный · редкий · выразительный',light:['#F8F5FA','#FFFFFF','#704184','#BA8DCB','#25172B'],dark:['#160E19','#25172B','#C995DB','#704184','#FAF1FC']}
    ];
    let dark=true;const host=document.querySelector('#palettes');
    function render(){host.innerHTML=palettes.map((p,i)=>{const c=dark?p.dark:p.light;return `<article class="palette" style="--bg:${c[0]};--card:${c[1]};--primary:${c[2]};--border:color-mix(in oklch,${c[4]} 18%,${c[0]});--muted-fg:color-mix(in oklch,${c[4]} 68%,${c[0]});--fg:${c[4]};--primary-fg:${dark?'#0A0A0A':'#FFFFFF'}"><div class="head"><span class="number">${i+1}</span><div><h2>${p.name}</h2><p>${p.vibe}</p></div></div><div class="swatches">${c.map(x=>`<i style="background:${x}">${x}</i>`).join('')}</div><div class="ui"><div><h3>Знания, которые двигают регион вперёд</h3><p>Практические программы, сильное сообщество и новые возможности для жителей Мангистау.</p><div class="buttons"><button class="btn primary">Начать обучение</button><button class="btn secondary">Программы</button></div></div><aside class="card"><small>Активных программ</small><strong>24</strong><small>Новый набор открыт</small></aside></div><div class="check"><b>✓</b> Контраст AA · светлая и тёмная темы</div></article>`}).join('')}
    document.querySelector('#theme').addEventListener('click',e=>{dark=!dark;document.documentElement.dataset.theme=dark?'dark':'light';document.body.style.background=dark?'#090909':'#e7e5e4';document.body.style.color=dark?'#f5f5f4':'#1c1917';e.currentTarget.textContent=dark?'Светлая тема':'Тёмная тема';render()});render();
  </script>
</body></html>
